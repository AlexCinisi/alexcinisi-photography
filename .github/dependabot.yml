version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps):"
    ignore:
      # Direttiva di progetto: gli upgrade major si pianificano, mai automatici.
      # La wildcard copre tutte le dipendenze, presenti e future — l'elenco a mano
      # invecchia da solo (verificato 23/8: @sanity/image-url, @portabletext/react e
      # @types/node erano scoperti). Minor e patch continuano ad arrivare.
      # NON blocca i security update: quelli passano comunque e possono trascinare
      # major come effetto collaterale — revisione umana obbligatoria (caso PR #39).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
